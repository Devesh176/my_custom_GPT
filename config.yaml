project:
    name: "my_custom_GPT"
    description: "A custom GPT model for text generation"
    version: "1.0.0"
    author: "Devesh176"

tokenizer:
    tokenizer_type: "BPE"
    tokenizer_vocab_path: "utils/bpe_vocab.json"
    tokenizer_merges_path: "utils/bpe_merges.txt"
    vocab_size: 50257        # matches GPT-2 / tiktoken gpt2 encoding

data_load:
    batch_size: 16           # unused directly; TRAINING_CONFIG.batch_size drives training
    block_size: 1024         # full context window (was 64 — caused overfitting)
    num_workers: 2
    stride: 1024             # FIX: non-overlapping windows (was 1 — caused massive redundancy & overfitting)
    max_length: 1024
    shuffle: True

GPT_CONFIG:
    model_name: "custom_gpt"
    model_type: "GPT"
    loss_function: "CrossEntropyLoss"
    scheduler: "CosineAnnealingLR"
    warmup_steps: 1000
    weight_decay: 0.01
    gradient_clip_val: 1.0
    save_checkpoint_every: 1000
    log_interval: 100
    emb_dim: 768
    n_heads: 12
    ff_hidden_dim: 3072      # FIX: 4 × emb_dim (was 1024, under-capacity)
    ctx_length: 1024         # FIX: matches block_size and positional embedding size
    dropout: 0.1
    qkv_bias: False
    n_layers: 12
    gradient_checkpointing: True  # recompute activations on backward — saves ~70% activation memory
    device: "cuda"

TRAINING_CONFIG:
    optimizer: "AdamW"
    loss_function: "CrossEntropyLoss"
    num_epochs: 10
    batch_size: 16                  # safe again with gradient_checkpointing; 7190 batches/epoch on WT103
    gradient_accumulation_steps: 1  # no accumulation needed
    weight_decay: 0.1
    learning_rate: 3e-4
    eval_freq: 1
    eval_iter: 50
    train_ratio: 0.9
    num_workers: 0
    log_interval: 200               # print loss every N batches so you can see progress
